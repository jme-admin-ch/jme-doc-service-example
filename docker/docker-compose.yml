# The infrastructure the doc service needs: a PostgreSQL database for the metadata of the documentation and an
# S3-compatible object storage for the documents themselves. The integration test starts this file itself, see
# jme-doc-test/src/test/resources/application.yml.

services:

  ############################################
  # Database
  ############################################
  jme-doc-db:
    image: postgres:18.6-alpine
    hostname: jme-doc-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: jme-doc-service-db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d jme-doc-service-db" ]
      interval: 5s
      timeout: 5s
      retries: 20

  ############################################
  # Object storage
  ############################################
  jme-doc-objectstorage:
    image: rustfs/rustfs:1.0.0-beta.12
    hostname: jme-doc-objectstorage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: us-east-1
      http_proxy: ''
      https_proxy: ''
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # The doc service does not start when its bucket is missing, so the bucket is created with the storage - and
  # so is its lifecycle rule, because a rule belongs to the bucket rather than to the service. It selects on
  # the tag the doc service writes on every object, not on a prefix: jeap.doc.storage.upload-prefix and
  # .site-prefix are configured per instance while the tag is the same everywhere.
  #
  #   jeap-doc-content=upload  the bundle of an upload. The doc service removes the upload from its database
  #                            after jeap.doc.upload.housekeeping.retention - 14 days - and the bundle is
  #                            expired here a day later, so an upload never outlives its bundle.
  #
  # There is deliberately NO rule over the generated sites, at any value. A site is published as one build per
  # part, and a build whose content hashes to what is already published uploads nothing - so the objects a
  # part is serving keep the date of the build that last changed that part, and a part nobody edits is as old
  # as the part itself. An age rule would expire exactly the documentation nobody has had to touch, and the
  # next build would find its digest unchanged and heal nothing. What removes a publication a part has
  # superseded is the doc service, after every successful build, down to jeap.doc.build.retention - it is the
  # only thing that knows which objects those are.
  #
  # Wherever this instance is deployed for real, the rules belong to the infrastructure code creating the
  # bucket; this is where they can be tried first. See
  # https://github.com/jeap-admin-ch/jeap-doc-service/blob/main/docs/operating-the-bucket.md
  jme-doc-objectstorage-init:
    image: amazon/aws-cli:2.36.41
    depends_on:
      jme-doc-objectstorage:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        aws --endpoint-url http://jme-doc-objectstorage:9000 s3api create-bucket --bucket jme-doc-service-documents || true
        aws --endpoint-url http://jme-doc-objectstorage:9000 s3api put-bucket-lifecycle-configuration \
          --bucket jme-doc-service-documents \
          --lifecycle-configuration '{"Rules":[{"ID":"expire-jeap-doc-uploads","Status":"Enabled","Filter":{"Tag":{"Key":"jeap-doc-content","Value":"upload"}},"Expiration":{"Days":15},"NoncurrentVersionExpiration":{"NoncurrentDays":1}}]}'
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      http_proxy: ''
      https_proxy: ''
      NO_PROXY: 'jme-doc-objectstorage,localhost,127.0.0.1'
      no_proxy: 'jme-doc-objectstorage,localhost,127.0.0.1'
