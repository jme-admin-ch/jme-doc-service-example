server:
  port: 8081

mockserver:
  base-url: "http://localhost:${server.port}/jme-doc-auth-scs"

# The doc pipelines of the systems authenticate themselves in the system context (SYS) and receive a token with
# the semantic roles configured here. The system a role is granted for is carried in its tenant part, so
# 'jme_%jme_@uploads_#write' allows uploading documentation for the system 'jme' and for no other system.
# See the jeap-oauth-mock-server project for the meaning of the configuration parameters.
oauth-mock-data:
  clients:

    # The doc pipeline of the system 'jme': it may publish the documentation of its own system.
    - client-id: "jme-doc-pipeline"
      client-secret: "{noop}secret"
      context: "SYS"
      userroles: [ "jme_%jme_@uploads_#write" ]
      audience: [ "jme-doc-service" ]

    # The doc pipeline of another system, used by the integration test to show that it cannot publish into the
    # documentation of the system 'jme'.
    - client-id: "other-system-doc-pipeline"
      client-secret: "{noop}secret"
      context: "SYS"
      userroles: [ "jme_%othersystem_@uploads_#write" ]
      audience: [ "jme-doc-service" ]

    # A client that may read the doc service API, without the right to change any documentation.
    - client-id: "jme-doc-reader"
      client-secret: "{noop}secret"
      context: "SYS"
      userroles: [ "jme_@docs_#read" ]
      audience: [ "jme-doc-service" ]

    # The doc service reading the architecture model of the stubbed upstream. The role carries no tenant
    # part - an architecture model is nobody's system in particular - and it is issued for the audience of
    # the stub rather than of the doc service, because the token is presented to the upstream and not to the
    # service that fetched it. On a real stage this client lives on the authorization server of the
    # architecture repository's stage, which is not the doc service's own.
    - client-id: "jme-doc-archrepo-reader"
      client-secret: "{noop}secret"
      context: "SYS"
      userroles: [ "jme_@architecture-model_#read" ]
      audience: [ "jme-doc-upstream-stub" ]

    # The doc service reading the reaction graphs of the stubbed observer. Like the architecture model this
    # role carries no tenant part - what reacted to what is nobody's system in particular - and it is issued
    # for the audience of the upstream. It is a second client rather than a second role on the one above,
    # because on a real stage these are two services, each with its own registration.
    - client-id: "jme-doc-reactions-reader"
      client-secret: "{noop}secret"
      context: "SYS"
      userroles: [ "jme_@reactions_#read" ]
      audience: [ "jme-doc-upstream-stub" ]

    # Whoever operates the instance: they may ask for a site to be published and read what the documentation
    # generator has been doing. These two roles carry no tenant part, unlike the upload roles above: a build
    # regenerates the documentation of every system on the site, not that of one system.
    - client-id: "jme-doc-operator"
      client-secret: "{noop}secret"
      context: "SYS"
      userroles: [ "jme_@sites_#admin", "jme_@sites_#read" ]
      audience: [ "jme-doc-service" ]
