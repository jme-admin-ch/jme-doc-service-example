spring:
  application:
    name: jme-doc-test
  main:
    banner-mode: off
  # Starts and stops the database and the object storage of the example around the integration test.
  docker:
    compose:
      enabled: true
      file: ../docker/docker-compose.yml
      lifecycle-management: start-and-stop
      skip:
        in-tests: false
      arguments:
        - "--project-name=${COMPOSE_PROJECT_NAME:jme-doc-service-example-it}"
      readiness:
        timeout: 120s
