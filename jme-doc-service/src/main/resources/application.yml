spring:
  application:
    name: jme-doc-service
  main:
    banner-mode: off

server:
  servlet:
    context-path: /${spring.application.name}

jeap:
  security:
    oauth2:
      resourceserver:
        resource-id: "https://resources.jme.admin.ch/jme/jme-doc-service"
        strict-audience-validation: "on"
        # Activates the semantic role model: a role of this instance reads 'jme_%<system>_@uploads_#write'.
        system-name: jme
  swagger:
    # The API documentation of the example is open, so it can be tried out at /jme-doc-service/swagger-ui.html.
    status: OPEN
  doc:
    storage:
      bucket: jme-doc-service-documents
      # The bundles are spooled to a file while they are transferred to the object storage, which is what keeps
      # them out of the memory of the service. Without a directory the temporary directory of the JVM is used,
      # which is a disk on a developer machine - a container whose /tmp is a memory-backed tmpfs has to point
      # this at a volume instead.
      # spool-directory: /var/jme-doc-service/spool
    upload:
      # The documentation sets of this example are small, so it accepts less than the 50MB the doc service
      # allows by default.
      max-size: 20MB
      # An upload is removed from the database after the retention, its bundle by a lifecycle rule of the
      # bucket - and the rule has to be set longer than the retention, so an upload never points at a bundle
      # that is already gone. These are the defaults of the doc service, spelled out because the two halves
      # belong together: the rule of this example is created with the bucket, see docker/docker-compose.yml.
      housekeeping:
        enabled: true
        retention: P14D
        cron: "0 30 2 * * *"
    build:
      # Where the site template's dependencies were installed - by the Maven build of this module into
      # target/site-install. An instance that ships a container puts them into its image instead; see the doc
      # service's docs/site-image.md. Without them the service does not start: it would otherwise fail
      # fifteen minutes into the first build, deep inside the bundler.
      #
      # It has to be an ABSOLUTE path: the search indexer symlinks this directory into a workspace of its own
      # under the build directory, and a relative path would be resolved against that workspace rather than
      # against the service - the link would dangle and the index would be built without pagefind. ${user.dir}
      # is the directory Maven starts this module in, which is the module itself.
      node-modules-directory: ${user.dir}/target/site-install/node_modules
      # How many parts of the site this instance generates at once. One, deliberately: every concurrent build
      # holds a Docusaurus run in the same container, so this is a memory decision rather than a parallelism
      # one - and a landscape of two systems is three parts, which one after another is fast enough on a
      # developer machine and in the build. An instance with a real landscape behind it raises this against
      # the memory a build is measured to hold.
      max-concurrent-parts: 1
      # The Node runtime, and the default. The site generator runs as a child process whose environment is
      # built from nothing, so a bare command name is looked up on /usr/bin:/bin and not on the PATH of
      # whoever started the service: a developer machine whose Node comes from nvm, fnm, asdf or Homebrew has
      # to name the binary, and an image names the absolute path of the one it copied in. See
      # docs/local-development.md.
      node-command: node
    sites:
      # The documentation sites of this instance. One site is one published whole - one navigation, one
      # layout - and this example publishes three.
      #
      # The default site is served at the context root and is the one an upload naming no site belongs to.
      # Everything else about it is left at the defaults of the doc service: the four environments
      # dev/ref/abn/prod with prod at the root, and publication on upload. A site is generated as one build
      # per part - the shell plus one per system - and its systems come from the architecture repository of
      # each environment (jeap.doc.archrepo, configured per profile) and from what was uploaded to it.
      default:
        title: JME Documentation
        # The tab of this site in the header bar, which every site of an instance with several sites shows.
        # Beside the logo, every site shows the default site's title.
        navigation-label: Systems
      # A second site, served at /site/handbook/: the handbook of the JME team, a tree of Markdown uploaded for
      # the site itself and published as it is - its folders and _category_.json files are its navigation, and
      # nothing is generated into it. It has no environments, so it is one tree at its root, and no
      # architecture model: no import publishes it, an upload of its tree does. See example-docs/handbook/.
      handbook:
        title: JME Handbook
        tagline: How the JME team works
        navigation-label: Handbook
        color-scheme: neutral
        per-environment: false
        content: static-site
      # A third site, served at /site/governance/: the reports of the Governance Service - the score of every
      # system and component, its history, and how well each rule is complied with. Nothing is uploaded for it
      # and no structure template writes it: it is generated from what the governance import read, which runs
      # when the Governance Service reports a completed scoring run and on a schedule as the safety net. Like
      # the handbook it has no environments, because a landscape has one Governance Service. The Governance
      # Service is configured per profile (jeap.doc.governance).
      governance:
        title: JME Governance
        tagline: How well the JME systems follow the platform's rules
        navigation-label: Governance
        color-scheme: neutral
        per-environment: false
        content: governance
        # Published by the governance import only; nothing is ever uploaded for this site.
        publish-on-upload: false
